site_name: Cairn
site_description: A production tracker and asset manager for small Blender projects.
site_url: https://alxiice.github.io/Cairn/
repo_url: https://github.com/Alxiice/Cairn
repo_name: Alxiice/Cairn
edit_uri: edit/main/docs/
copyright: Apache License 2.0

nav:
  - Home: index.md
  - Installation: install.md
  - Using Cairn: usage.md
  - Plugins: plugins.md
  - Development:
      - Contributing: contributing.md
      - Development plan: development-plan.md
  - Changelog: changelog.md

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
  features:
    - navigation.instant
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight

extra_css:
  - stylesheets/cairn.css
extra_javascript:
  - javascripts/cairn.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
