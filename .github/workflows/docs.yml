name: Docs

# Builds the documentation and the coverage report (with the coverage badge) and, on main, publishes both on
# GitHub Pages. Needs Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdocs build --strict
      - name: Coverage report and badge
        run: |
          python -m pytest --cov --cov-report=html:site/coverage --cov-report=json
          python - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = next(c for limit, c in [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"), (0, "orange")] if pct >= limit)
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color},
                    open("site/coverage/badge.json", "w"))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
